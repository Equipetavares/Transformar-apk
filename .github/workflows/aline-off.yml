name: Compilar Aline off (APK de teste)
on:
  workflow_dispatch:
  push:
    branches: [aline-off]
    paths: ['aline-off/**']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aline-off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sh test-rules.sh
      - run: gradle --no-daemon :app:assembleDebug
      - run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Aline-off-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aline-off-APK
          path: aline-off/Aline-off-1.0.0-debug.apk
          if-no-files-found: error
